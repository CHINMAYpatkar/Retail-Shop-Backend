services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Must match the database name in .env.example's DATABASE_URL. It did
      # not: compose created `retail_shop` while the template connected to
      # `RetailShop`, so a fresh clone that followed both got a connection
      # error to a database that was never created.
      POSTGRES_DB: RetailShop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "4000:4000"

volumes:
  pgdata:
